<section xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="py-3">
    <h1 th:text="${titulo}">Configurações</h1>
    <p class="text-secondary">Gerencie os cadastros de apoio do Thindesk.</p>
    <div th:if="${mensagem}" class="alert alert-success" role="status" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
    <form th:action="@{/{categoria}/salvar(categoria=${categoria})}" th:object="${item}" method="post" class="dashboard-panel mb-4">
        <h2 th:text="${item.id == null ? 'Novo cadastro' : 'Editar cadastro'}"></h2>
        <input type="hidden" th:field="*{id}">
        <div class="mb-3"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" th:field="*{nome}" maxlength="120" required></div>
        <div class="mb-3"><label class="form-label" for="descricao">Descrição</label><textarea class="form-control" id="descricao" th:field="*{descricao}" maxlength="1000" rows="3"></textarea></div>
        <button type="submit" class="btn btn-dark">Salvar</button>
        <a th:if="${item.id != null}" th:href="@{/{categoria}(categoria=${categoria})}" class="btn btn-outline-secondary">Cancelar edição</a>
    </form>
    <div class="dashboard-panel table-responsive"><table class="table align-middle">
        <thead><tr><th scope="col">Nome</th><th scope="col">Descrição</th><th scope="col">Ações</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(itens)}"><td colspan="3">Nenhum cadastro encontrado.</td></tr>
            <tr th:each="cadastro : ${itens}">
                <td th:text="${cadastro.nome}"></td><td class="text-break" th:text="${cadastro.descricao}"></td>
                <td><div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/{categoria}(categoria=${categoria},editar=${cadastro.id})}">Editar</a>
                    <form method="post" th:action="@{/{categoria}/excluir/{id}(categoria=${categoria},id=${cadastro.id})}" onsubmit="return confirm('Excluir este cadastro?')"><button type="submit" class="btn btn-outline-danger btn-sm">Excluir</button></form>
                </div></td>
            </tr>
        </tbody>
    </table></div>
</section>

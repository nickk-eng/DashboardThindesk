<section xmlns:th="http://www.thymeleaf.org" th:fragment="content" class="py-3">
    <h1>Horário de Atendimento</h1>
    <p class="text-secondary">Defina os horários de atendimento por setor.</p>
    <div th:if="${mensagem}" class="alert alert-success" role="status" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
    <form th:action="@{/ajustes-horarios/salvar}" th:object="${novoHorario}" method="post" class="dashboard-panel mb-4">
        <div class="row g-3">
            <div class="col-md-4"><label for="setor" class="form-label">Setor</label><input id="setor" th:field="*{setor}" class="form-control" maxlength="120" required></div>
            <div class="col-md-4"><label for="diaSemana" class="form-label">Dia da semana</label><input id="diaSemana" th:field="*{diaSemana}" class="form-control" maxlength="40" placeholder="Ex.: Segunda-feira" required></div>
            <div class="col-md-2"><label for="horarioInicio" class="form-label">Início</label><input id="horarioInicio" type="time" th:field="*{horarioInicio}" class="form-control" required></div>
            <div class="col-md-2"><label for="horarioFim" class="form-label">Fim</label><input id="horarioFim" type="time" th:field="*{horarioFim}" class="form-control" required></div>
        </div>
        <button type="submit" class="btn btn-dark mt-3">Salvar horário</button>
    </form>
    <div class="dashboard-panel table-responsive"><table class="table align-middle">
        <thead><tr><th scope="col">Setor</th><th scope="col">Dia</th><th scope="col">Início</th><th scope="col">Fim</th><th scope="col">Ações</th></tr></thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(horarios)}"><td colspan="5">Nenhum horário cadastrado.</td></tr>
            <tr th:each="horario : ${horarios}">
                <td th:text="${horario.setor}"></td><td th:text="${horario.diaSemana}"></td><td th:text="${horario.horarioInicio}"></td><td th:text="${horario.horarioFim}"></td>
                <td><form method="post" th:action="@{/ajustes-horarios/deletar/{id}(id=${horario.id})}" onsubmit="return confirm('Excluir este horário?')"><button type="submit" class="btn btn-outline-danger btn-sm">Excluir</button></form></td>
            </tr>
        </tbody>
    </table></div>
</section>
